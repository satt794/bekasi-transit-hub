name: TransitKita Browser QA
on:
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/transitkita-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      BACKEND_URL: https://bekasi-transit-hub.vercel.app
      QA_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Test the checked-out build
        run: |
          npm run start > /tmp/transitkita-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          npx playwright test qa/browser.spec.ts --workers=1
